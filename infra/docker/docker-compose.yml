# Personal Finance MCP Server
#
# Levantar: docker compose -f infra/docker/docker-compose.yml up -d
# Logs:     docker compose -f infra/docker/docker-compose.yml logs -f app

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: finance-mcp-app
    stdin_open: true
    tty: true
    env_file:
      - ../../.env

volumes: {}
